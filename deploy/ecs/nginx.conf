# Nginx in front of the Node app. Cloudflare DNS (proxied, orange cloud) sits in
# front of this, giving HTTPS and caching; set SSL/TLS mode to "Flexible", or
# "Full" after installing a Cloudflare Origin Certificate here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8787;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
