name: CI & deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions"; exit 1; fi
      - name: Create D1 database if needed and wire its id
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="airesume") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create airesume
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="airesume") | .uuid')
          fi
          echo "D1 id: $ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
      - run: npx wrangler d1 migrations apply airesume --remote
      - run: npm run build:web
      - run: npx wrangler deploy
      - name: Push secrets to the Worker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          for k in JWT_SECRET GROQ_API_KEY RAPIDAPI_KEY ADMIN_EMAILS; do
            v="${!k}"; [ -n "$v" ] && printf '%s' "$v" | npx wrangler secret put "$k" || echo "skip $k (not set)"
          done
      - name: Smoke test
        run: |
          echo "Deployed. Health check:"; curl -fsS "https://airesume.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/api/health" || echo "(set CLOUDFLARE_WORKERS_SUBDOMAIN secret to enable the smoke test)"
