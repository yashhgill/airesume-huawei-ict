name: Copy D1 data to Supabase
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="airesume") | .uuid'); sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          npx wrangler d1 export airesume --remote --no-schema --output data.sql > out.txt 2>&1 || { echo "::error::$(tr '\n' ' ' < out.txt | tail -c 900)"; exit 1; }
      - run: node scripts/d1-to-supabase.mjs data.sql
        env:
          SUPABASE_URL: https://kpezyztbqstilpgishjd.supabase.co
          SUPABASE_KEY: sb_publishable__b8CrzRqTM95cEA2jbIKIw_XJrkY0_i
          PF_DB_SECRET: ${{ secrets.PF_DB_SECRET }}
