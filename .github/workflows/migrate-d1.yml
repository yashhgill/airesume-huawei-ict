name: Copy D1 data to Supabase
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx wrangler d1 export airesume --remote --no-schema --output data.sql
      - run: node scripts/d1-to-supabase.mjs data.sql
        env:
          SUPABASE_URL: https://kpezyztbqstilpgishjd.supabase.co
          SUPABASE_KEY: sb_publishable__b8CrzRqTM95cEA2jbIKIw_XJrkY0_i
          PF_DB_SECRET: ${{ secrets.PF_DB_SECRET }}
